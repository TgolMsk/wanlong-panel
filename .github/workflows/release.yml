# 在 GitHub 上构建 Windows 安装包。
#
#   · 推到 main            → 构建，产物挂在这次运行的 Artifacts 里（登录 GitHub 才能下载，默认保留 90 天）
#   · 推 v* 标签           → 构建 + 自动创建同名 Release，安装包（nsis）与免安装版（portable）作为附件公开下载
#   · Actions 页手动触发   → 只构建、只传 Artifacts
#
# 发一个版本的完整步骤见 README「发布安装包」一节：改 package.json 的 version → 提交 → 打 v<version> 标签 → 推送。
# 不做代码签名（与本地 npm run dist:win 一致），首次运行安装包时 SmartScreen 会提示「未知发布者」。

name: 构建安装包

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows x64（nsis + portable）
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 放行 install-scripts（npm ≥ 11 才需要，npm 10 自动跳过）
        run: npm run approve

      - name: 类型检查 + 打包 main / preload / renderer
        run: npm run build

      - name: electron-builder 打 Windows 安装包
        run: npx electron-builder --win --x64 --publish never

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: wanlong-panel-win-x64-${{ github.sha }}
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml
          if-no-files-found: error

      - name: 发布到 GitHub Release（只在推 v* 标签时）
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml
          generate_release_notes: true
          fail_on_unmatched_files: true
